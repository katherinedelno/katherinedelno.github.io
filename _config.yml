# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# Site settings
title: "Katherine Delno"
description: "Katherine Delno provides private mathematics and statistics instruction, one-on-one teaching in AP Statistics, AP Calculus, and AP Precalculus. M.S. Statistics, University of Washington."
url: https://katherinedelno.com
baseurl: ""            # if you host under a subdirectory, put it here (e.g. "/blog")
author: "Katherine Delno"

# Cloudflare Web Analytics: paste the beacon token from your Cloudflare
# dashboard between the quotes to turn on analytics site-wide. Leave empty to disable.
cloudflare_analytics: ""

# Serif typography test. Set to true to preview the site in Libertinus Serif
# (matching the redesigned course materials); set to false to revert instantly
# to the current Hanken Grotesk look. Nothing else needs to change.
use_serif: false

# The practice sets.
# A collection rather than more posts, so that site.posts stays exactly what it
# has always been and nothing on the resources page has to learn about a second
# kind of article. Output is on, so each set gets its own permanent URL.
collections:
  practice:
    output: true
    permalink: /practice/:name/

# Theme & plugins
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Top‐nav links
# (Minima will pick these up automatically if you list them here)
header_pages:
  - index.markdown
  - private-instruction.md
  - about.md
  - resources.md


# Email list.
# Paste your provider's form endpoint between the quotes to switch every signup
# form on the site from a placeholder to a working form. Nothing else changes.
#   Buttondown  https://buttondown.com/api/emails/embed-subscribe/YOUR-USERNAME
#   Kit         https://app.kit.com/forms/YOUR-FORM-ID/subscriptions
#   Mailchimp   the action URL from the embedded-form snippet
# Left empty, the forms render an RSS link and a mailto instead, so no address
# is ever collected into nowhere.
newsletter_action: ""

# Google Forms backend for the signup blocks.
# The form posts invisibly to your own Google Form; visitors never see Google,
# and answers land in the linked spreadsheet. Used only when newsletter_action
# above is empty, so pasting a provider endpoint there takes precedence.
# To find these: open the form, three-dot menu, Pre-fill form, enter a dummy
# value, Get link. The id is between /d/e/ and /viewform; the field is the
# entry.NNNNNNN key in the query string.
google_form_id: "1FAIpQLSez7O1JZg6ia_tYk29ol4zXfTFn6mXQwVnCz_zcqEZRCF6T4w"
google_form_email_field: "entry.158450840"
google_form_course_field: "entry.1668351078"

# Social preview cards.
# Every post carries its own `image:` written by tools/og-cards.py; this default
# covers the standalone pages. jekyll-seo-tag reads `image` and, when it finds
# one, upgrades the Twitter card from `summary` to `summary_large_image`.
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/og/default.png"
  # Practice sets always use the practice layout and always need MathJax, so
  # neither has to be repeated in thirty files of front matter.
  - scope:
      path: ""
      type: "practice"
    values:
      layout: "practice"
      math: true

# Used by jekyll-seo-tag for the Person JSON-LD block.
social:
  name: "Katherine Delno"
  links:
    - https://katherinedelno.com

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
