<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Brand refinements: editorial serif for headings, slightly looser reading measure -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    .pg h1, .pg h2,
    .pi h1, .pi h2,
    .pi-hero h1, .pi-section h2,
    .hero-grid h1, .pg-hero h1,
    .article-head h1, .article-body h2 {
      font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      letter-spacing: -.015em;
    }
    .pg p, .pi p { line-height: 1.68; }
  </style>

  {%- if site.cloudflare_analytics and site.cloudflare_analytics != "" -%}
  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ site.cloudflare_analytics }}"}'></script>
  {%- endif -%}
</head>
