# Frequently asked questions for the private instruction page.
# This file is the single source of truth: private-instruction.md renders
# the <details> list from it AND emits the FAQPage JSON-LD from it, so the
# structured data can never drift from what visitors actually read.
# Each answer is a list of paragraphs; they render as sibling <p> elements
# and are joined with a space for the JSON-LD.
# Answers may contain inline HTML (links); it is stripped for the JSON-LD.

- q: How is this different from homework help?
  a:
    - Homework help begins with the assignment. My instruction begins with the student.
    - We may use the student's homework, but I am watching how they reason, where the work begins to break down, and whether they can complete a similar problem without help. The goal is increasing independence over time.
- q: What if my student understands an explanation but can't do the problems alone?
  a:
    - This is common. Following an explanation and producing the reasoning independently are different skills.
    - That is why independent work is built into every session. It shows us what the student can actually reproduce once the prompts are gone.
- q: How do you know what my student needs to work on?
  a:
    - By watching them work.
    - The setup, notation, hesitation, and recurring errors usually tell me much more than a final answer. I keep those observations in my notes so the picture becomes more precise over time.
- q: Why do you recommend a consistent weekly schedule?
  a:
    - A regular schedule gives the work continuity. It also makes it easier to stay close to the pace of the class and address small gaps before they begin affecting later topics.
- q: Are sessions online or in person?
  a:
    - Sessions are conducted live over Zoom using a shared digital whiteboard. Notes and materials are kept in a private shared folder so the student can return to the work afterward.
- q: How do you align with my student's class?
  a:
    - I follow the student's course pacing and plan around current topics, assignments, and the patterns I see in their work. The instruction is meant to support the course they are actually taking rather than run separately from it.
- q: Do you teach courses beyond the three listed?
  a:
    - Yes. AP coursework is the center of my practice, but I also work with students in non-AP and college-level mathematics and statistics.
    - If your course is not listed, write to me and we can discuss whether it is a good fit.
- q: What happens before the AP exam?
  a:
    - During the final one to two months, sessions shift toward focused exam preparation. This includes timed practice, full free-response and multiple-choice work, and targeted review.
    - All preparation materials are included.
- q: What if we need to reschedule?
  a:
    - Occasional schedule changes are normal, and I will try to find another time in the same week when possible.
    - I ask for at least 24 hours' notice. Sessions cancelled within that window, and missed sessions, are billed in full because the time was reserved for that student. Every family receives one exception per term without question. Illness and emergencies are handled with common sense.
    - The full policy is available under <a href="/policies/">Policies</a>.
- q: Is the between-session support required?
  a:
    - No. It is an optional monthly add-on for families who want assigned practice, written feedback, and additional support between sessions.
    - Many students do well with the weekly session alone.
- q: What does my student need to get started?
  a:
    - A quiet space, stable internet, a graphing calculator if the course requires one, and a consistent way to take notes.
    - I recommend the TI-84 Plus CE for AP Statistics, AP Calculus, and AP Precalculus.
